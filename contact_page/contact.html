<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="/contact_page/contact.css">
</head>
<body>
    <div class="total_container">
       

        <div id="menu" class="menu_container">
                <a href="/index.html">Home</a>
                <a href="/projects page/projects.html">Projects</a>
                <a href="/contact_page/contact.html">Contact</a>
            </div>



        <div class="contact_container">
            <div class="contact_section">
                <span style="font-size: 40px;">Contact Page</span> 
                <br>
                <caption>Get in touch with me!</caption>
                <br> <br>
                <form action="/send-message" method="POST" id="contactForm">
                    <div>
                        <label class="placeholder" for="firstName">First Name<span style="color: red; font-weight: normal;">*</span>:</label>
                        
                        <input style="text-align: center;" type="text" name="firstName" id="firstName" placeholder="John" required>

                        <label class="placeholder" for="lastName">Last Name<span style="color: red; font-weight: normal;">*</span>:</label>
                        
                        <input style="text-align: center;" type="text" name="lastName" id="lastName" placeholder="Doe" required>
                    </div>
                    <div style="margin-top: 15px;">
                        <label class="placeholder" for="phoneNumber">Phone Number:</label>
                        
                        <input style="text-align: center;" type="tel" name="phoneNumber" id="phoneNumber" placeholder="123-456-7890">

                        <label class="placeholder" for="email">Email<span style="color: red; font-weight: normal;">*</span>:</label>
                        
                        <input style="text-align: center;" type="email" name="email" id="email"  placeholder="example@gmail.com" required>
                    </div>
                    <div class="centralize">
                        <label for="message" class="placeholder">Message</label>
                    </div>
                    <div>
                        <textarea class="message_box" name="message" id="message"></textarea>
                    </div>
                    <div>
                        <input type="text" name="company" autocomplete="off" tabindex="-1" style="position: absolute; left: -9999px;">

                        <input class="submit_btn" type="submit" value="Submit">

                        <p id="status"></p>
                    </div>
                </form>
            </div>
        </div>



        </div>
    </div>
    <script src="/contact_page/contact.js"></script>
</body>
</html>
